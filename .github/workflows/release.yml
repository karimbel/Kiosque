name: Construire Kiosque

# Se lance quand tu publies une étiquette de version (v0.1.0, v0.2.0…)
# ou à la demande, depuis l'onglet « Actions » du dépôt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installeur-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les outils JavaScript
        run: npm install

      - name: Régénérer les icônes à partir du logo
        run: npx tauri icon app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kiosque v__VERSION__"
          releaseBody: "Télécharge le fichier Kiosque_…_x64-setup.exe dans la liste « Assets » ci-dessous, puis lance-le."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
