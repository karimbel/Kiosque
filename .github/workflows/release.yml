name: Construire Kiosque

# Se lance tout seul dès qu'un changement du programme est envoyé sur GitHub (publier.cmd),
# ou à la demande depuis l'onglet « Actions ». Les changements de README ou d'images ne
# relancent rien. La release de la version en cours est mise à jour avec les nouveaux fichiers.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "app-icon.png"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installeur-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les outils JavaScript
        run: npm install

      - name: Régénérer les icônes à partir du logo
        run: npx tauri icon app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kiosque v__VERSION__"
          releaseBody: "Dans la liste « Assets » — Windows : Kiosque_…_x64-setup.exe (installation) ou Kiosque_…_portable.exe (aucune installation). macOS : Kiosque_…_universal.dmg. Linux : Kiosque_….AppImage ou .deb."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # Version portable : le programme seul, sans installation (Windows 10/11 fournit déjà WebView2).
      - name: Ajouter la version portable à la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          FICHIER="Kiosque_${VERSION}_portable.exe"
          cp src-tauri/target/release/kiosque.exe "$FICHIER"
          gh release upload "v${VERSION}" "$FICHIER" --clobber --repo "${{ github.repository }}"

  # macOS et Linux : construits après Windows (la release existe alors déjà, les fichiers s'y ajoutent).
  installeurs-macos-linux:
    needs: installeur-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: macOS
            os: macos-latest
            cibles: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - nom: Linux
            os: ubuntu-22.04
            cibles: ""
            args: --bundles appimage,deb
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Installer les bibliothèques Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cibles }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les outils JavaScript
        run: npm install

      - name: Régénérer les icônes à partir du logo
        run: npx tauri icon app-icon.png

      # macOS : signature « ad hoc » (sans compte développeur). Sans elle, les Mac récents refusent d'ouvrir le programme.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "Kiosque v__VERSION__"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
