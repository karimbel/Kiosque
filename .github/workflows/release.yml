name: Construire Kiosque

# Se lance quand tu publies une étiquette de version (v0.1.0, v0.2.0…)
# ou à la demande, depuis l'onglet « Actions » du dépôt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installeur-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les outils JavaScript
        run: npm install

      - name: Régénérer les icônes à partir du logo
        run: npx tauri icon app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kiosque v__VERSION__"
          releaseBody: "Dans la liste « Assets » : Kiosque_…_x64-setup.exe (installation) ou Kiosque_…_portable.exe (aucune installation, il suffit de le lancer)."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # Version portable : le programme seul, sans installation (Windows 10/11 fournit déjà WebView2).
      - name: Ajouter la version portable à la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          FICHIER="Kiosque_${VERSION}_portable.exe"
          cp src-tauri/target/release/kiosque.exe "$FICHIER"
          gh release upload "v${VERSION}" "$FICHIER" --clobber --repo "${{ github.repository }}"
