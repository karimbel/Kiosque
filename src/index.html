<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosque</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <!-- Applique l'état de la barre avant le premier affichage, pour éviter un saut visuel. -->
  <script>try { if (localStorage.getItem('nav') === 'collapsed') document.documentElement.dataset.nav = 'collapsed'; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Auvent rayé : même motif que le logo, sur toute la largeur de la fenêtre.
       Deux tailles : grande quand la barre est déployée, petite quand elle est rétractée. -->
  <svg class="awning" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="awning-stripes" width="104" height="44" patternUnits="userSpaceOnUse">
        <path class="stripe-a" d="M0 0H52V18A26 26 0 0 1 0 18Z"/>
        <path class="stripe-b" d="M52 0H104V18A26 26 0 0 1 52 18Z"/>
      </pattern>
      <pattern id="awning-stripes-small" width="52" height="22" patternUnits="userSpaceOnUse">
        <path class="stripe-a" d="M0 0H26V9A13 13 0 0 1 0 9Z"/>
        <path class="stripe-b" d="M26 0H52V9A13 13 0 0 1 26 9Z"/>
      </pattern>
    </defs>
    <rect class="awning-big" width="100%" height="44" fill="url(#awning-stripes)"/>
    <rect class="awning-small" width="100%" height="22" fill="url(#awning-stripes-small)"/>
  </svg>

  <div class="shell">
    <header class="top" id="top">
      <div class="brand">
        <img src="logo.svg" alt="" width="76" height="76">
        <div class="brand-text">
          <h1>Kiosque</h1>
          <p class="tagline" data-t="Ton actualité vidéo, à portée de clics">Ton actualité vidéo, à portée de clics</p>
        </div>
      </div>

      <nav class="tabs" aria-label="Sections" data-t-aria="Sections">
        <button type="button" data-tab="new">À voir</button>
        <button type="button" data-tab="later" data-t="Plus tard">Plus tard</button>
        <button type="button" data-tab="seen" data-t="Vues">Vues</button>
        <button type="button" data-tab="channels" data-t="Chaînes">Chaînes</button>
      </nav>

      <div class="top-actions">
        <span id="status" role="status" aria-live="polite"></span>
        <button id="refresh" type="button" data-t="Actualiser">Actualiser</button>
        <button id="nav-toggle" class="nav-toggle" type="button" aria-controls="top" aria-expanded="true"
                aria-label="Réduire la barre de navigation" title="Réduire la barre de navigation">
          <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M5 12.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="update" class="update" hidden>
      <span id="update-text"></span>
      <progress id="update-bar" max="100" value="0" hidden></progress>
      <button type="button" class="primary" data-update="open" data-t="Mettre à jour">Mettre à jour</button>
      <button type="button" class="quiet" data-update="close" aria-label="Fermer" data-t-aria="Fermer">×</button>
    </div>

    <div class="stage">
      <main id="view" tabindex="-1"></main>
      <!-- Lecteur intégré : se superpose à la liste sans la recharger, la barre de navigation reste accessible. -->
      <section id="player" class="player" hidden aria-label="Lecteur vidéo" data-t-aria="Lecteur vidéo"></section>
    </div>
  </div>

  <script src="i18n.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
